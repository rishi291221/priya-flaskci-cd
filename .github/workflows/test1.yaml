name: Flask CI/CD _ Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: priya/flask-cicd
  CONTAINER_NAME: flask-practice_EC2
  APP_PORT: 5000


# ============================================================
# JOB 1 - TEST
# ============================================================

jobs:

  test:

    name: "1. Test"

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # STAGE 1 - CHECKOUT
      # --------------------------------------------------------

      - name: "1. Checkout"

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # STAGE 2 - INSTALL
      # --------------------------------------------------------

      - name: "2. Setup Python"

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: "2. Install dependencies"

        run: |

          echo "======================================"
          echo "STAGE 2 - INSTALL"
          echo "======================================"

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          echo "Dependencies installed successfully."


      # --------------------------------------------------------
      # STAGE 3 - TEST
      # --------------------------------------------------------

      - name: "3. Run pytest"

        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        run: |

          echo "======================================"
          echo "STAGE 3 - TEST"
          echo "======================================"

          pytest -v

          echo "======================================"
          echo "ALL TESTS PASSED"
          echo "======================================"


# ============================================================
# JOB 2 - BUILD + PUSH ECR
# ============================================================

  build:

    name: "2. Build + Push ECR"

    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------

      - name: "Checkout"

        uses: actions/checkout@v4


      # --------------------------------------------------------
      # STAGE 4 - BUILD
      # --------------------------------------------------------

      - name: "4. Build Docker image"

        run: |

          echo "======================================"
          echo "STAGE 4 - BUILD"
          echo "======================================"

          echo "Building image with commit SHA:"
          echo "${{ github.sha }}"

          docker build \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            .

          echo "Docker image built successfully."


      # --------------------------------------------------------
      # AWS CREDENTIALS
      # --------------------------------------------------------

      - name: "Configure AWS credentials"

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ secrets.AWS_REGION }}


      # --------------------------------------------------------
      # STAGE 5 - ECR LOGIN
      # --------------------------------------------------------

      - name: "5. Login to Amazon ECR"

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # STAGE 5 - PUSH
      # --------------------------------------------------------

      - name: "5. Push Docker image to ECR"

        env:

          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "======================================"
          echo "STAGE 5 - PUSH TO ECR"
          echo "======================================"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image URI:"
          echo "$IMAGE_URI"

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$IMAGE_URI"

          docker push "$IMAGE_URI"

          echo "======================================"
          echo "IMAGE PUSHED TO ECR SUCCESSFULLY"
          echo "======================================"


# ============================================================
# JOB 3 - DEPLOY + VERIFY EC2
# ============================================================

  deploy:

    name: "3. Deploy + Verify EC2"

    runs-on: ubuntu-latest

    needs:
      - build

    steps:

      # --------------------------------------------------------
      # STAGE 6 - DEPLOY TO EC2
      # --------------------------------------------------------

      - name: "6. Deploy to EC2"

        uses: appleboy/ssh-action@v1.2.5

        env:

          AWS_REGION: ${{ secrets.AWS_REGION }}

          ECR_REGISTRY: 206226812351.dkr.ecr.us-east-1.amazonaws.com

          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}

          IMAGE_TAG: ${{ github.sha }}

          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}

          APP_PORT: ${{ env.APP_PORT }}

          MONGO_URI: ${{ secrets.MONGO_URI }}

          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ec2-user

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,CONTAINER_NAME,APP_PORT,MONGO_URI,SECRET_KEY

          script: |

            set -e

            echo "======================================"
            echo "STAGE 6 - DEPLOY TO EC2"
            echo "======================================"

            echo "Connected user:"
            whoami

            echo "Hostname:"
            hostname

            echo "Docker version:"
            docker --version


            # --------------------------------------------------
            # IMAGE URI
            # --------------------------------------------------

            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Docker image:"
            echo "$IMAGE_URI"


            # --------------------------------------------------
            # ECR LOGIN
            # --------------------------------------------------

            echo "Logging into Amazon ECR..."

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "ECR login successful."


            # --------------------------------------------------
            # PULL IMAGE
            # --------------------------------------------------

            echo "Pulling Docker image..."

            docker pull "$IMAGE_URI"

            echo "Docker image pulled successfully."


            # --------------------------------------------------
            # STOP OLD CONTAINER
            # --------------------------------------------------

            echo "Stopping existing container..."

            docker stop "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # REMOVE OLD CONTAINER
            # --------------------------------------------------

            echo "Removing existing container..."

            docker rm "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # CREATE APPLICATION DIRECTORY
            # --------------------------------------------------

            mkdir -p "$HOME/flask-practice"


            # --------------------------------------------------
            # CREATE ENVIRONMENT FILE
            # --------------------------------------------------

            echo "Creating application environment file..."

            cat > "$HOME/flask-practice/.env" <<EOF
            MONGO_URI=$MONGO_URI
            SECRET_KEY=$SECRET_KEY
            EOF

            chmod 600 "$HOME/flask-practice/.env"


            # --------------------------------------------------
            # START CONTAINER
            # --------------------------------------------------

            echo "Starting new container..."

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file "$HOME/flask-practice/.env" \
              -p "$APP_PORT:$APP_PORT" \
              "$IMAGE_URI"

            echo "New container started."


            # --------------------------------------------------
            # SHOW CONTAINER
            # --------------------------------------------------

            docker ps \
              --filter "name=$CONTAINER_NAME"

            echo "======================================"
            echo "STAGE 6 - DEPLOYMENT COMPLETED"
            echo "======================================"


      # --------------------------------------------------------
      # STAGE 7 - VERIFY
      # --------------------------------------------------------

      - name: "7. Verify /health"

        uses: appleboy/ssh-action@v1.2.5

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ec2-user

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          script: |

            set -e

            echo "======================================"
            echo "STAGE 7 - VERIFY"
            echo "======================================"

            HEALTH_URL="http://127.0.0.1:5000/health"

            echo "Health URL:"
            echo "$HEALTH_URL"


            # --------------------------------------------------
            # POLL HEALTH ENDPOINT
            # --------------------------------------------------

            for i in {1..12}
            do

              echo ""
              echo "Health check attempt $i/12..."

              HTTP_STATUS=$(curl \
                --silent \
                --output /tmp/health_response.txt \
                --write-out "%{http_code}" \
                "$HEALTH_URL" || true)

              echo "HTTP status: $HTTP_STATUS"


              if [ "$HTTP_STATUS" = "200" ]; then

                echo ""
                echo "======================================"
                echo "APPLICATION HEALTHY"
                echo "======================================"

                echo "Health response:"

                cat /tmp/health_response.txt

                echo ""

                echo "STAGE 7 - VERIFY SUCCESS"

                exit 0

              fi


              echo "Application not ready yet."

              sleep 5

            done


            # --------------------------------------------------
            # HEALTH FAILURE
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "STAGE 7 - VERIFY FAILED"
            echo "======================================"

            echo "The application did not return HTTP 200."


            echo ""
            echo "Container status:"

            docker ps -a \
              --filter "name=$CONTAINER_NAME"


            echo ""
            echo "Container logs:"

            docker logs "$CONTAINER_NAME" --tail 50 || true


            exit 1


# ============================================================
# JOB 4 - Success  NOTIFICATION
# ============================================================

  notify:

    name: "4. Success / Failure Notification"

    runs-on: ubuntu-latest

    needs:
      - test
      - build
      - deploy

    if: always()

    steps:


      # ========================================================
      # SUCCESS EMAIL
      # ========================================================

      - name: "SUCCESS - Send email"

        if: |
          needs.test.result == 'success' &&
          needs.build.result == 'success' &&
          needs.deploy.result == 'success'

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}

          to: ${{ secrets.MAIL_TO }}

          subject: "SUCCESS - Flask CI/CD Deployment"

          body: |

            Flask CI/CD Deployment SUCCESS


            ==========================================
            DEPLOYMENT SUCCESS
            ==========================================

            Repository: ${{ github.repository }}

            Commit SHA: ${{ github.sha }}

            Status: SUCCESS


            Pipeline Results:

            Checkout        - SUCCESS
            Install         - SUCCESS
            Test            - SUCCESS
            Build           - SUCCESS
            Push ECR        - SUCCESS
            Deploy EC2      - SUCCESS
            Verify /health  - SUCCESS


            The application was successfully deployed
            to EC2 and returned HTTP 200 from /health.


            Docker image:

            ${{ github.sha }}


            Workflow:

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


            ==========================================
            Flask CI/CD Deployment completed successfully.
            ==========================================


# # ============================================================
# JOB  5- Failure  NOTIFICATION
# ============================================================



      - name: "FAILURE - Send email"

        if: |
          needs.test.result != 'success' ||
          needs.build.result != 'success' ||
          needs.deploy.result != 'success'

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}

          to: ${{ secrets.MAIL_TO }}

          subject: "FAILED - Flask CI/CD Deployment"

          body: |

            Flask CI/CD Deployment FAILED


            ==========================================
            DEPLOYMENT FAILURE
            ==========================================

            Repository: ${{ github.repository }}

            Commit SHA: ${{ github.sha }}

            Status: FAILED


            ==========================================
            FAILED STAGE
            ==========================================


            TEST JOB:
            ${{ needs.test.result }}


            BUILD + ECR JOB:
            ${{ needs.build.result }}


            EC2 DEPLOYMENT JOB:
            ${{ needs.deploy.result }}


            ==========================================
            FAILURE DETAILS
            ==========================================


            If TEST failed:

            pytest failed.

            Docker image was NOT built,
            pushed or deployed.


            If BUILD + ECR failed:

            Docker build or ECR push failed.

            The image was NOT deployed to EC2.


            If EC2 DEPLOYMENT failed:

            EC2 deployment or SSH failed.


            If VERIFY failed:

            The application did not return
            HTTP 200 from /health.


            ==========================================
            PIPELINE
            ==========================================

            Checkout
            Install
            Test
            Build
            Push ECR
            Deploy EC2
            Verify /health


            Please check the GitHub Actions logs:

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


            ==========================================
            Flask CI/CD Deployment FAILED.
            ==========================================
