name: Flask CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL ENVIRONMENT
# ============================================================

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: priya/flask-cicd
  CONTAINER_NAME: flask-practice
  APP_PORT: 5000


jobs:

  # ============================================================
  # SINGLE CI/CD JOB
  # ============================================================

  deploy:

    name: Flask CI/CD Pipeline

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================

      - name: 1 - Checkout
        uses: actions/checkout@v4


      # ========================================================
      # 2. INSTALL
      # ========================================================

      - name: 2 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: 2 - Install dependencies
        run: |

          echo "======================================"
          echo "STAGE 2 - INSTALL"
          echo "======================================"

          python --version

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          echo "Dependencies installed successfully."


      # ========================================================
      # 3. TEST
      # ========================================================

      - name: 3 - Run pytest
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        run: |

          echo "======================================"
          echo "STAGE 3 - TEST"
          echo "======================================"

          pytest -v

          echo "All tests passed."


      # ========================================================
      # 4. BUILD
      # ========================================================

      - name: 4 - Build Docker image
        run: |

          echo "======================================"
          echo "STAGE 4 - BUILD"
          echo "======================================"

          docker build \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            .

          echo "Docker image built successfully."

          echo "Image:"
          echo "$ECR_REPOSITORY:${{ github.sha }}"


      # ========================================================
      # AWS CONFIGURATION
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ========================================================
      # 5. PUSH TO ECR
      # ========================================================

      - name: 5 - Login to Amazon ECR
        id: ecr

        uses: aws-actions/amazon-ecr-login@v2


      - name: 5 - Push Docker image to ECR

        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |

          echo "======================================"
          echo "STAGE 5 - PUSH TO ECR"
          echo "======================================"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          echo "ECR image:"
          echo "$IMAGE_URI"


          echo "Tagging Docker image..."

          docker tag \
            "$ECR_REPOSITORY:${{ github.sha }}" \
            "$IMAGE_URI"


          echo "Pushing Docker image to ECR..."

          docker push "$IMAGE_URI"


          echo "Docker image pushed successfully."


      # ========================================================
      # 6. DEPLOY TO EC2
      # ========================================================

      - name: 6 - Deploy to EC2

        uses: appleboy/ssh-action@v1.2.5

        env:

          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}

          AWS_REGION: ${{ env.AWS_REGION }}

          IMAGE_TAG: ${{ github.sha }}

          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}

          APP_PORT: ${{ env.APP_PORT }}

          MONGO_URI: ${{ secrets.MONGO_URI }}

          SECRET_KEY: ${{ secrets.SECRET_KEY }}


        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          envs: ECR_REGISTRY,ECR_REPOSITORY,AWS_REGION,IMAGE_TAG,CONTAINER_NAME,APP_PORT,MONGO_URI,SECRET_KEY


          script: |

            set -e


            echo "======================================"
            echo "STAGE 6 - DEPLOY TO EC2"
            echo "======================================"


            echo "Connected to EC2 successfully."

            echo "Username:"
            whoami

            echo "Hostname:"
            hostname

            echo "Docker version:"
            docker --version


            # --------------------------------------------------
            # Create application directory
            # --------------------------------------------------

            mkdir -p ~/flask-practice


            # --------------------------------------------------
            # Create environment file
            # --------------------------------------------------

            echo "Creating application environment file..."


            cat > ~/flask-practice/.env <<EOF
            MONGO_URI=$MONGO_URI
            SECRET_KEY=$SECRET_KEY
            EOF


            chmod 600 ~/flask-practice/.env


            # --------------------------------------------------
            # ECR LOGIN
            # --------------------------------------------------

            echo "Logging into Amazon ECR..."


            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"


            echo "ECR login successful."


            # --------------------------------------------------
            # IMAGE URI
            # --------------------------------------------------

            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


            echo "Pulling image:"
            echo "$IMAGE_URI"


            # --------------------------------------------------
            # PULL IMAGE
            # --------------------------------------------------

            docker pull "$IMAGE_URI"


            echo "Image pulled successfully."


            # --------------------------------------------------
            # STOP OLD CONTAINER
            # --------------------------------------------------

            echo "Stopping old container..."


            docker stop "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # REMOVE OLD CONTAINER
            # --------------------------------------------------

            echo "Removing old container..."


            docker rm "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # START NEW CONTAINER
            # --------------------------------------------------

            echo "Starting new container..."


            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file ~/flask-practice/.env \
              -p "$APP_PORT:$APP_PORT" \
              "$IMAGE_URI"


            echo "New container started."


            # --------------------------------------------------
            # SHOW CONTAINER
            # --------------------------------------------------

            echo "Container status:"


            docker ps \
              --filter "name=$CONTAINER_NAME"


            echo "Deployment completed."


      # ========================================================
      # 7. VERIFY
      # ========================================================

      - name: 7 - Verify application health

        uses: appleboy/ssh-action@v1.2.5

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22


          script: |

            set -e


            echo "======================================"
            echo "STAGE 7 - VERIFY"
            echo "======================================"


            echo "Waiting for Flask application..."


            for i in {1..12}
            do

              echo ""
              echo "Health check attempt $i/12"


              if curl -fsS \
                http://localhost:5000/health
              then

                echo ""
                echo "======================================"
                echo "HEALTH CHECK PASSED"
                echo "======================================"


                exit 0

              fi


              echo "Health check failed."


              sleep 5

            done


            # --------------------------------------------------
            # HEALTH CHECK FAILED
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "HEALTH CHECK FAILED"
            echo "======================================"


            echo ""
            echo "Container status:"


            docker ps -a \
              --filter "name=flask-practice"


            echo ""
            echo "Container logs:"


            docker logs flask-practice --tail 100 || true


            exit 1


      # ========================================================
      # 8. NOTIFY - SUCCESS
      # ========================================================

      - name: 8 - Send success email

        if: success()

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}

          to: ${{ secrets.MAIL_TO }}

          subject: "SUCCESS - Flask CI/CD deployment completed"

          body: |

            Flask CI/CD deployment completed successfully.


            ==========================================
            DEPLOYMENT DETAILS
            ==========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}


            ==========================================
            PIPELINE STAGES
            ==========================================

            1. Checkout        : SUCCESS
            2. Install         : SUCCESS
            3. Test            : SUCCESS
            4. Docker Build    : SUCCESS
            5. Push to ECR     : SUCCESS
            6. Deploy to EC2   : SUCCESS
            7. /health Verify  : SUCCESS


            ==========================================
            DOCKER
            ==========================================

            ECR Repository:
            priya/flask-cicd

            Container:
            flask-practice

            Image Tag:
            ${{ github.sha }}


            ==========================================
            APPLICATION
            ==========================================

            Health endpoint:
            /health

            Health check:
            HTTP 200


            ==========================================
            GITHUB ACTIONS
            ==========================================

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


      # ========================================================
      # 8. NOTIFY - FAILURE
      # ========================================================

      - name: 8 - Send failure email

        if: failure()

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}

          to: ${{ secrets.MAIL_TO }}

          subject: "FAILED - Flask CI/CD deployment"

          body: |

            Flask CI/CD deployment FAILED.


            ==========================================
            DEPLOYMENT DETAILS
            ==========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}


            ==========================================
            PIPELINE STAGES
            ==========================================

            One or more required stages failed.


            1. Checkout
            2. Install
            3. Test
            4. Docker Build
            5. Push to ECR
            6. Deploy to EC2
            7. /health Verify


            ==========================================
            IMPORTANT
            ==========================================

            If pytest failed, the pipeline stopped
            before Docker Build, ECR Push, Deploy
            and Health Verification.


            If ECR Push failed, the Docker image
            could not be uploaded to Amazon ECR.


            If EC2 Deployment failed, the new
            container could not be deployed.


            If Health Verification failed, the
            application did not return HTTP 200
            from /health.


            ==========================================
            ECR REPOSITORY
            ==========================================

            priya/flask-cicd


            ==========================================
            CONTAINER
            ==========================================

            flask-practice


            ==========================================
            GITHUB ACTIONS
            ==========================================

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
