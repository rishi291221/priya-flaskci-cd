name: Flask CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL VARIABLES
# ============================================================

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: priya/flask-cicd
  CONTAINER_NAME: flask-practice
  APP_PORT: 5000


jobs:

  # ============================================================
  # JOB 1 - TEST
  # ============================================================

  test:

    name: "1 - TEST_app.py is success"

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------

      - name: 1.1 - Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------

      - name: 1.2 - Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------

      - name: 1.3 - Install dependencies
        run: |

          echo "======================================"
          echo "INSTALLING DEPENDENCIES"
          echo "======================================"

          python --version

          python -m pip install --upgrade pip

          pip install -r requirements.txt

          echo "Dependencies installed successfully."


      # --------------------------------------------------------
      # 4. Run pytest
      # --------------------------------------------------------

      - name: 1.4 - Run pytest
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        run: |

          echo "======================================"
          echo "RUNNING PYTEST"
          echo "======================================"

          pytest -v

          echo "======================================"
          echo "ALL TESTS PASSED"
          echo "======================================"


  # ============================================================
  # JOB 2 - Docker->ECR to EC2
  # ============================================================

  build-deploy:

    name: "2 - BUILD / RUN"

    needs: test

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------

      - name: 2.1 - Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # 2. Build Docker image
      # --------------------------------------------------------

      - name: 2.2 - Build Docker image
        run: |

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          docker build \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            .

          echo "Docker image built successfully."

          echo "Image:"
          echo "$ECR_REPOSITORY:${{ github.sha }}"


      # --------------------------------------------------------
      # 3. Configure AWS
      # --------------------------------------------------------

      - name: 2.3 - Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # --------------------------------------------------------
      # 4. Login to ECR
      # --------------------------------------------------------

      - name: 2.4 - Login to Amazon ECR
        id: ecr

        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # 5. Push image to ECR
      # --------------------------------------------------------

      - name: 2.5 - Push Docker image to ECR

        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |

          echo "======================================"
          echo "PUSHING IMAGE TO ECR"
          echo "======================================"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          echo "Image URI:"
          echo "$IMAGE_URI"


          echo "Tagging image..."

          docker tag \
            "$ECR_REPOSITORY:${{ github.sha }}" \
            "$IMAGE_URI"


          echo "Pushing image..."

          docker push "$IMAGE_URI"


          echo "======================================"
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "======================================"


      # --------------------------------------------------------
      # 6. Deploy to EC2
      # --------------------------------------------------------

      - name: 2.6 - Deploy to EC2

        uses: appleboy/ssh-action@v1.2.5

        env:

          AWS_REGION: ${{ secrets.AWS_REGION }}

          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}

          IMAGE_TAG: ${{ github.sha }}

          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}

          APP_PORT: ${{ env.APP_PORT }}

          MONGO_URI: ${{ secrets.MONGO_URI }}

          SECRET_KEY: ${{ secrets.SECRET_KEY }}


        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,CONTAINER_NAME,APP_PORT,MONGO_URI,SECRET_KEY


          script: |

            set -e


            echo "======================================"
            echo "CONNECTED TO EC2"
            echo "======================================"


            echo "User:"
            whoami


            echo "Hostname:"
            hostname


            echo "Docker:"
            docker --version


            # --------------------------------------------------
            # Create application directory
            # --------------------------------------------------

            mkdir -p ~/flask-practice


            # --------------------------------------------------
            # Create environment file
            # --------------------------------------------------

            echo "Creating environment file..."


            cat > ~/flask-practice/.env <<EOF
            MONGO_URI=$MONGO_URI
            SECRET_KEY=$SECRET_KEY
            EOF


            chmod 600 ~/flask-practice/.env


            # --------------------------------------------------
            # Login to ECR
            # --------------------------------------------------

            echo "======================================"
            echo "LOGGING INTO ECR"
            echo "======================================"


            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"


            echo "ECR login successful."


            # --------------------------------------------------
            # Build image URI
            # --------------------------------------------------

            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"


            echo "======================================"
            echo "IMAGE TO DEPLOY"
            echo "======================================"


            echo "$IMAGE_URI"


            # --------------------------------------------------
            # Pull exact commit image
            # --------------------------------------------------

            echo "Pulling Docker image..."


            docker pull "$IMAGE_URI"


            echo "Image pulled successfully."


            # --------------------------------------------------
            # Stop old container
            # --------------------------------------------------

            echo "Stopping old container..."


            docker stop "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # Remove old container
            # --------------------------------------------------

            echo "Removing old container..."


            docker rm "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # Start new container
            # --------------------------------------------------

            echo "======================================"
            echo "STARTING NEW CONTAINER"
            echo "======================================"


            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file ~/flask-practice/.env \
              -p "$APP_PORT:$APP_PORT" \
              "$IMAGE_URI"


            echo "Container started."


            # --------------------------------------------------
            # Show container status
            # --------------------------------------------------

            docker ps \
              --filter "name=$CONTAINER_NAME"


      # --------------------------------------------------------
      # 7. Verify application
      # --------------------------------------------------------

      - name: 2.7 - Verify /health

        uses: appleboy/ssh-action@v1.2.5

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22


          script: |

            set -e


            echo "======================================"
            echo "VERIFYING FLASK APPLICATION"
            echo "======================================"


            echo "Waiting for application..."


            for i in {1..12}
            do

              echo ""
              echo "Health check attempt $i/12"


              if curl -fsS http://localhost:5000/health
              then

                echo ""
                echo "======================================"
                echo "HEALTH CHECK PASSED"
                echo "======================================"


                exit 0

              fi


              echo "Application is not ready yet."

              sleep 5

            done


            # --------------------------------------------------
            # Health check failed
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "HEALTH CHECK FAILED"
            echo "======================================"


            echo ""
            echo "Container status:"


            docker ps -a \
              --filter "name=flask-practice"


            echo ""
            echo "Container logs:"


            docker logs flask-practice --tail 100 || true


            exit 1


  # ============================================================
  # JOB 3 - NOTIFICATION
  # ============================================================

  notify:

    name: "3 - NOTIFICATION"

    needs:
      - test
      - build-deploy

    # IMPORTANT:
    # Run this job even if TEST or BUILD/DEPLOY fails.
    if: ${{ always() }}

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # SUCCESS EMAIL
      # ========================================================

      - name: 3.1 - Send SUCCESS notification

        if: ${{ needs.test.result == 'success' && needs.build-deploy.result == 'success' }}

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}

          to: ${{ secrets.MAIL_TO }}

          subject: "SUCCESS - Flask CI/CD deployment completed"

          body: |

            ==========================================
            FLASK CI/CD - SUCCESS
            ==========================================


            Flask CI/CD pipeline completed successfully.


            Repository:
            ${{ github.repository }}


            Branch:
            ${{ github.ref_name }}


            Commit:
            ${{ github.sha }}


            ==========================================
            PIPELINE RESULTS
            ==========================================

            TEST:
            SUCCESS


            BUILD / RUN:
            SUCCESS


            ECR:
            SUCCESS


            EC2 DEPLOYMENT:
            SUCCESS


            HEALTH CHECK:
            SUCCESS


            ==========================================
            ECR REPOSITORY
            ==========================================

            priya/flask-cicd


            ==========================================
            EC2 CONTAINER
            ==========================================

            flask-practice


            ==========================================
            HEALTH ENDPOINT
            ==========================================

            http://localhost:5000/health

            HTTP 200 received.


            ==========================================
            GITHUB ACTIONS RUN
            ==========================================

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


            Deployment completed successfully.


      # ========================================================
      # FAILURE EMAIL
      # ========================================================

      - name: 3.2 - Send FAILURE notification

        if: ${{ needs.test.result == 'failure' || needs.build-deploy.result == 'failure' }}

        uses: dawidd6/action-send-mail@v6

        with:

          server_address: smtp.gmail.com

          server_port: 465

          secure: true

          username: ${{ secrets.MAIL_USERNAME }}

          password: ${{ secrets.MAIL_PASSWORD }}

          from: ${{ secrets.MAIL_USERNAME }}

          to: ${{ secrets.MAIL_TO }}

          subject: "FAILED - Flask CI/CD pipeline"

          body: |

            ==========================================
            FLASK CI/CD - FAILURE
            ==========================================


            Flask CI/CD pipeline FAILED.


            Repository:
            ${{ github.repository }}


            Branch:
            ${{ github.ref_name }}


            Commit:
            ${{ github.sha }}


            ==========================================
            PIPELINE RESULTS
            ==========================================

            TEST:
            ${{ needs.test.result }}


            BUILD / RUN:
            ${{ needs.build-deploy.result }}


            ==========================================
            POSSIBLE FAILURE POINTS
            ==========================================

            1. Checkout

            2. Python dependency installation

            3. Pytest

            4. Docker build

            5. AWS authentication

            6. ECR login

            7. ECR push

            8. EC2 SSH connection

            9. Docker image pull

            10. Docker container startup

            11. /health verification


            ==========================================
            IMPORTANT
            ==========================================

            If TEST failed:

            The pipeline stopped before
            BUILD / RUN.


            If TEST succeeded but BUILD / RUN failed:

            Check the Build / Run job logs.


            ==========================================
            ECR REPOSITORY
            ==========================================

            priya/flask-cicd


            ==========================================
            EC2 CONTAINER
            ==========================================

            flask-practice


            ==========================================
            GITHUB ACTIONS RUN
            ==========================================

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


            Please check the GitHub Actions logs
            for the exact failure.
