name: Flask CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# GLOBAL VARIABLES
# ============================================================
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: priya/flask-cicd
  CONTAINER_NAME: flask-practice_EC2
  APP_PORT: 5000


# ============================================================
# JOB 1 - CHECKOUT + INSTALL + TEST
# ============================================================
jobs:

  test:
    name: "1-3 Checkout, Install and Test"
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # STAGE 1 - CHECKOUT
      # ======================================================
      - name: "1. Checkout"
        uses: actions/checkout@v4


      # ======================================================
      # STAGE 2 - INSTALL
      # ======================================================
      - name: "2. Install Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "2. Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      # ======================================================
      # STAGE 3 - TEST
      # ======================================================
      - name: "3. Run pytest"
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "======================================"
          echo "RUNNING PYTEST"
          echo "======================================"

          pytest -v

          echo "======================================"
          echo "ALL TESTS PASSED"
          echo "======================================"


  # ============================================================
  # JOB 2 - BUILD + PUSH + DEPLOY
  # ============================================================
  deploy:
    name: "4-6 Build, Push and Deploy"
    runs-on: ubuntu-latest

    needs: test

    steps:

      # ======================================================
      # CHECKOUT FOR BUILD
      # ======================================================
      - name: "Checkout source"
        uses: actions/checkout@v4


      # ======================================================
      # STAGE 4 - BUILD
      # ======================================================
      - name: "4. Build Docker image"
        run: |

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          docker build \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            .

          echo "Docker image built successfully."

          echo "Image:"
          docker images "$ECR_REPOSITORY"


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================
      - name: "Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # ======================================================
      # STAGE 5 - PUSH TO ECR
      # ======================================================
      - name: "5. Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: "5. Tag and Push image to ECR"
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}

        run: |

          echo "======================================"
          echo "PUSHING IMAGE TO ECR"
          echo "======================================"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image URI:"
          echo "$IMAGE_URI"


          # Tag local image with full ECR URI
          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$IMAGE_URI"


          # Push image
          docker push "$IMAGE_URI"


          echo "======================================"
          echo "IMAGE PUSHED SUCCESSFULLY"
          echo "======================================"

          echo "$IMAGE_URI"


      # ======================================================
      # STAGE 6 - DEPLOY TO EC2
      # ======================================================
      - name: "6. Deploy to EC2"
        uses: appleboy/ssh-action@v1.2.5

        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}

          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        with:

          # --------------------------------------------------
          # EC2 CONNECTION
          # --------------------------------------------------

          host: ${{ secrets.EC2_HOST }}

          username: ec2-user

          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22


          # --------------------------------------------------
          # ENVIRONMENT VARIABLES
          # --------------------------------------------------

          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,CONTAINER_NAME,APP_PORT,MONGO_URI,SECRET_KEY


          # --------------------------------------------------
          # DEPLOYMENT SCRIPT
          # --------------------------------------------------

          script: |

            set -e

            echo "======================================"
            echo "EC2 DEPLOYMENT"
            echo "======================================"

            echo "Connected user:"
            whoami

            echo "Hostname:"
            hostname

            echo "Docker:"
            docker --version


            # ==================================================
            # IMAGE URI
            # ==================================================

            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Image URI:"
            echo "$IMAGE_URI"


            # ==================================================
            # LOGIN TO ECR
            # ==================================================

            echo "======================================"
            echo "LOGIN TO ECR"
            echo "======================================"

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "ECR login successful."


            # ==================================================
            # PULL NEW IMAGE
            # ==================================================

            echo "======================================"
            echo "PULLING IMAGE"
            echo "======================================"

            docker pull "$IMAGE_URI"

            echo "Image pulled successfully."


            # ==================================================
            # STOP OLD CONTAINER
            # ==================================================

            echo "======================================"
            echo "STOPPING OLD CONTAINER"
            echo "======================================"

            docker stop "$CONTAINER_NAME" || true


            # ==================================================
            # REMOVE OLD CONTAINER
            # ==================================================

            echo "Removing old container..."

            docker rm "$CONTAINER_NAME" || true


            # ==================================================
            # CREATE APPLICATION DIRECTORY
            # ==================================================

            mkdir -p ~/flask-practice


            # ==================================================
            # CREATE ENVIRONMENT FILE
            # ==================================================

            echo "Creating application environment..."

            cat > ~/flask-practice/.env <<EOF
            MONGO_URI=$MONGO_URI
            SECRET_KEY=$SECRET_KEY
            EOF

            chmod 600 ~/flask-practice/.env


            # ==================================================
            # START NEW CONTAINER
            # ==================================================

            echo "======================================"
            echo "STARTING NEW CONTAINER"
            echo "======================================"

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file ~/flask-practice/.env \
              -p "$APP_PORT:$APP_PORT" \
              "$IMAGE_URI"

            echo "New container started."


            # ==================================================
            # BASIC CONTAINER CHECK
            # ==================================================

            echo "======================================"
            echo "CONTAINER STATUS"
            echo "======================================"

            docker ps \
              --filter "name=$CONTAINER_NAME"


            echo "Deployment commands completed."


  # ============================================================
  # JOB 3 - VERIFY
  # ============================================================
  verify:
    name: "7. Verify /health"
    runs-on: ubuntu-latest

    needs: deploy

    steps:

      # ======================================================
      # STAGE 7 - VERIFY
      # ======================================================
      - name: "7. Verify application health"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          APP_PORT: 5000

        run: |

          echo "======================================"
          echo "VERIFYING APPLICATION"
          echo "======================================"

          HEALTH_URL="http://$EC2_HOST:$APP_PORT/health"

          echo "Health URL:"
          echo "$HEALTH_URL"

          echo ""
          echo "Waiting for application to become healthy..."


          # --------------------------------------------------
          # Poll /health for up to 60 seconds
          # --------------------------------------------------

          for i in {1..12}
          do

            echo "Health check attempt $i/12..."

            HTTP_STATUS=$(curl \
              --silent \
              --output /tmp/health_response.txt \
              --write-out "%{http_code}" \
              "$HEALTH_URL" || true)


            echo "HTTP status: $HTTP_STATUS"


            if [ "$HTTP_STATUS" = "200" ]; then

              echo "======================================"
              echo "APPLICATION IS HEALTHY"
              echo "======================================"

              cat /tmp/health_response.txt

              exit 0

            fi


            echo "Application not ready yet."

            sleep 5

          done


          # --------------------------------------------------
          # Health check failed
          # --------------------------------------------------

          echo "======================================"
          echo "HEALTH CHECK FAILED"
          echo "======================================"

          echo "Application did not return HTTP 200."

          exit 1


  # ============================================================
  # JOB 4 - NOTIFY
  # ============================================================
  notify:
    name: "8. Notify"
    runs-on: ubuntu-latest

    # Run even when an earlier job fails
    if: always()

    needs:
      - test
      - deploy
      - verify

    steps:

      # ======================================================
      # STAGE 8 - SUCCESS EMAIL
      # ======================================================
      - name: "8. Send success notification"
        if: ${{ needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify.result == 'success' }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "SUCCESS - Flask CI/CD Deployment"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |
            Flask CI/CD deployment completed successfully.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Pipeline stages completed:

            1. Checkout       - SUCCESS
            2. Install        - SUCCESS
            3. Test           - SUCCESS
            4. Build          - SUCCESS
            5. Push to ECR    - SUCCESS
            6. Deploy to EC2  - SUCCESS
            7. Verify /health - SUCCESS

            Application:
            http://${{ secrets.EC2_HOST }}:5000/health

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


      # ======================================================
      # STAGE 8 - FAILURE EMAIL
      # ======================================================
      - name: "8. Send failure notification"
        if: ${{ !(needs.test.result == 'success' && needs.deploy.result == 'success' && needs.verify.result == 'success') }}
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "FAILED - Flask CI/CD Pipeline"

          to: ${{ secrets.MAIL_TO }}

          from: ${{ secrets.MAIL_USERNAME }}

          body: |
            Flask CI/CD pipeline FAILED.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit:
            ${{ github.sha }}

            Pipeline results:

            1. Checkout       - COMPLETED
            2. Install        - ${{ needs.test.result }}
            3. Test           - ${{ needs.test.result }}
            4. Build          - ${{ needs.deploy.result }}
            5. Push to ECR    - ${{ needs.deploy.result }}
            6. Deploy to EC2  - ${{ needs.deploy.result }}
            7. Verify /health - ${{ needs.verify.result }}

            Please check the GitHub Actions workflow logs.

            Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
