name: Flask CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: priya/flask-cicd
  CONTAINER_NAME: flask-practice
  APP_PORT: 5000

# ============================================================
# JOBS
# ============================================================
jobs:

  # ==========================================================
  # JOB 1 - TEST
  # ==========================================================
  test:
    name: "1. Run Tests"
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: 1. Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------
      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      # --------------------------------------------------------
      # 4. Run tests
      # --------------------------------------------------------
      - name: 4. Run pytest
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          pytest -v


  # ==========================================================
  # JOB 2 - BUILD + ECR + DEPLOY
  # ==========================================================
  deploy:
    name: "5-9 Build, Push, Deploy and Verify"
    runs-on: ubuntu-latest

    # Deploy only if tests pass
    needs: test

    steps:

      # --------------------------------------------------------
      # 5. Checkout
      # --------------------------------------------------------
      - name: 5. Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 6. Configure AWS credentials
      # --------------------------------------------------------
      - name: 6. Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------------
      # 7. Login to Amazon ECR
      # --------------------------------------------------------
      - name: 7. Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # 8. Build and Push Docker Image
      # --------------------------------------------------------
      - name: 8. Build and Push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Image URI:"
          echo "$IMAGE_URI"

          docker build \
            -t "$IMAGE_URI" \
            .

          echo "Docker image built successfully."

          echo "======================================"
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "======================================"

          docker push "$IMAGE_URI"

          echo "Docker image pushed successfully."


      # --------------------------------------------------------
      # 9. Deploy to EC2
      # --------------------------------------------------------
      - name: 9. Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5

        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}

          MONGO_URI: ${{ secrets.MONGO_URI }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

        with:
          # ----------------------------------------------------
          # EC2 SSH CONFIGURATION
          # ----------------------------------------------------
          host: ${{ secrets.EC2_HOST }}

          # Your EC2 is Amazon Linux 2023
          username: ec2-user

          # Private key stored in GitHub Repository Secrets
          key: ${{ secrets.EC2_SSH_KEY }}

          port: 22

          # ----------------------------------------------------
          # Pass environment variables to EC2
          # ----------------------------------------------------
          envs: AWS_REGION,ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,CONTAINER_NAME,APP_PORT,MONGO_URI,SECRET_KEY

          # ----------------------------------------------------
          # EC2 deployment script
          # ----------------------------------------------------
          script: |

            set -e

            echo "======================================"
            echo "EC2 DEPLOYMENT"
            echo "======================================"

            echo "Connected user:"
            whoami

            echo "EC2 hostname:"
            hostname

            echo "Docker version:"
            docker --version

            # --------------------------------------------------
            # Create full image URI
            # --------------------------------------------------

            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "======================================"
            echo "IMAGE INFORMATION"
            echo "======================================"

            echo "Commit SHA:"
            echo "$IMAGE_TAG"

            echo "Docker image:"
            echo "$IMAGE_URI"


            # --------------------------------------------------
            # Authenticate EC2 with ECR
            # --------------------------------------------------

            echo "======================================"
            echo "LOGIN TO AMAZON ECR"
            echo "======================================"

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            echo "ECR login successful."


            # --------------------------------------------------
            # Pull exact image from ECR
            # --------------------------------------------------

            echo "======================================"
            echo "PULLING DOCKER IMAGE"
            echo "======================================"

            docker pull "$IMAGE_URI"

            echo "Image pulled successfully."


            # --------------------------------------------------
            # Stop existing container
            # --------------------------------------------------

            echo "======================================"
            echo "STOPPING OLD CONTAINER"
            echo "======================================"

            docker stop "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # Remove existing container
            # --------------------------------------------------

            echo "Removing old container..."

            docker rm "$CONTAINER_NAME" || true


            # --------------------------------------------------
            # Create application directory
            # --------------------------------------------------

            echo "Creating application directory..."

            mkdir -p ~/flask-practice


            # --------------------------------------------------
            # Create environment file
            # --------------------------------------------------

            echo "Creating application environment file..."

            cat > ~/flask-practice/.env <<EOF
MONGO_URI=$MONGO_URI
SECRET_KEY=$SECRET_KEY
EOF

            chmod 600 ~/flask-practice/.env


            # --------------------------------------------------
            # Start new container
            # --------------------------------------------------

            echo "======================================"
            echo "STARTING NEW CONTAINER"
            echo "======================================"

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file ~/flask-practice/.env \
              -p "$APP_PORT:$APP_PORT" \
              "$IMAGE_URI"

            echo "New container started."


            # --------------------------------------------------
            # Verify container
            # --------------------------------------------------

            echo "======================================"
            echo "VERIFYING CONTAINER"
            echo "======================================"

            docker ps \
              --filter "name=$CONTAINER_NAME"


            # --------------------------------------------------
            # Show container logs
            # --------------------------------------------------

            echo "======================================"
            echo "CONTAINER LOGS"
            echo "======================================"

            docker logs "$CONTAINER_NAME" --tail 20 || true


            echo "======================================"
            echo "EC2 DEPLOYMENT COMPLETED"
            echo "======================================"
